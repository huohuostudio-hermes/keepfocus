<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keep Focus">
<meta name="theme-color" content="#000000">
<title>Keep Focus</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --accent: #d9c9a3;
    --accent2: #ab9a6e;
    --text: #e6e9f2;
    --subtext: #9aa0b5;
    --glass: #000000;
    --guide: #5a4d2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 13.5px;
    color: var(--text);
    overflow: hidden;
    user-select: text;
    -webkit-user-select: text;
  }
  .card {
    margin: 0;
    height: 100%;
    background: var(--glass);
    border-radius: 0;
    box-shadow:
      inset 0 1px 0 #ab9a6e,
      inset 1px 0 0 #5a4d2e,
      inset 0 -1px 0 #5a4d2e,
      inset -1px 0 0 #5a4d2e,
      0 18px 50px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .topbar {
    height: 44px; display: flex; align-items: center; padding: 0 14px;
    border-bottom: 1px solid #ab9a6e;
    box-shadow: 0 1px 8px rgba(217,201,163,.5), 0 1px 20px rgba(217,201,163,.22);
    user-select: none; -webkit-user-select: none; flex-shrink: 0; position: relative;
  }
  .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; color: #fff; }
  .title .wd { font-size: 11px; color: var(--subtext); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1; }
  .icon-btn {
    background: transparent; border: 1px solid #ab9a6e; color: var(--subtext);
    border-radius: 6px; width: 24px; height: 24px; font-size: 12px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; margin-left: 6px;
    transition: all .15s;
  }
  .icon-btn:hover { color: #fff; border-color: #d9c9a3; }
  .icon-btn.pinned { color: var(--accent); border-color: rgba(217,201,163,0.6); }
  .lock-ico { width: 12px; height: 12px; display: block; }
  .lock-locked { display: none; }
  .icon-btn.pinned .lock-locked { display: block; }
  .icon-btn.pinned .lock-unlocked { display: none; }
  .input-wrap { padding: 12px 14px 4px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  input.inp {
    background: rgba(0,0,0,0.22); border: 1px solid #ab9a6e; border-radius: 999px;
    padding: 9px 16px; color: var(--text); font-size: 13px; outline: none; width: 100%;
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
    box-shadow: inset 0 0 0 1px var(--kf-inp-load, transparent);
  }
  input.inp:focus { border-color: rgba(217,201,163,0.6); box-shadow: inset 0 0 0 1px var(--kf-inp-load, transparent), 0 0 0 3px rgba(217,201,163,0.15); }
  .target-badge {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    background: rgba(217,201,163,0.14); border: 1px solid rgba(217,201,163,0.45); color: #e8dcc0;
    border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer; max-width: 100%;
  }
  .target-badge .x { color: var(--subtext); margin-left: 2px; }
  .target-badge .x:hover { color: #fff; }
  .chips { display: flex; gap: 6px; }
  .chip {
    padding: 4px 11px; border-radius: 999px; font-size: 11.5px; cursor: pointer;
    background: rgba(228,235,244,0.06); border: 1px solid #5a4d2e; color: var(--subtext);
    transition: all .15s; user-select: none; -webkit-user-select: none;
  }
  .chip:hover { color: #fff; }
  .chip.active { background: rgba(217,201,163,0.18); border-color: rgba(217,201,163,0.5); color: #fff; }
  .progress { display: flex; align-items: center; gap: 9px; padding: 8px 16px 2px; font-size: 11.5px; color: var(--subtext); flex-shrink: 0; }
  .bar { flex: 1; height: 5px; background: rgba(228,235,244,0.10); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width .35s cubic-bezier(.22,1,.36,1); }
  .list { flex: 1; overflow-y: auto; padding: 6px 10px 12px; }
  .kids { border-left: 1px solid var(--guide); margin-left: 15px; padding-left: 8px; }
  .item { display: flex; align-items: flex-start; gap: 7px; padding: 7px 10px 7px 4px; border-radius: 10px; transition: background .15s; }
  .item:hover { background: rgba(228,235,244,0.10); }
  .item.done { opacity: 0.45; }
  .item.done .txt { text-decoration: line-through; }
  .item.selected { outline: 1px solid rgba(217,201,163,0.55); background: rgba(217,201,163,0.08); }
  .item.dragging { opacity: 0.35; }
  .item.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; background: rgba(217,201,163,0.10); }
  .list.drop-root { outline: 2px dashed var(--accent); outline-offset: -3px; }
  .ctx-menu {
    position: absolute; z-index: 200;
    background: rgba(30,33,45,0.98); border: 1px solid #5a4d2e; border-radius: 8px; padding: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,.55), 0 0 12px rgba(217,201,163,.15);
  }
  .ctx-item {
    display: block; width: 100%; text-align: left; white-space: nowrap;
    background: none; border: none; color: var(--text); cursor: pointer;
    padding: 7px 16px; font-size: 12.5px; font-family: inherit; border-radius: 5px;
  }
  .ctx-item:hover { background: rgba(217,201,163,0.14); color: #fff; }
  .arrow { width: 14px; flex-shrink: 0; text-align: center; cursor: pointer; font-size: 11px; color: var(--subtext); margin-top: 2px; user-select: none; -webkit-user-select: none; }
  .arrow:hover { color: #fff; }
  .arrow.leaf { visibility: hidden; cursor: default; }
  .arrow.d0 { color: #f87171; }
  .arrow.d1 { color: #fbbf24; }
  .arrow.d2 { color: #3b82f6; }
  .arrow.d3 { color: #22c55e; }
  .arrow.d4 { color: #facc15; }
  .num { min-width: 16px; text-align: left; flex-shrink: 0; font-size: 11px; color: rgba(154,160,181,0.72); margin-top: 2px; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
  .cb {
    width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid #ab9a6e;
    flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .18s; user-select: none; -webkit-user-select: none;
  }
  .item.done .cb { background: var(--accent); border-color: var(--accent); }
  .cb::after { content: "✓"; color: #fff; font-size: 11px; opacity: 0; transform: scale(.4); transition: all .18s; }
  .item.done .cb::after { opacity: 1; transform: scale(1); }
  .grip { width: 14px; flex-shrink: 0; text-align: center; cursor: grab; font-size: 12px; color: rgba(154,160,181,0.55); margin-top: 2px; user-select: none; -webkit-user-select: none; }
  .grip:hover { color: #d9c9a3; }
  .grip:active { cursor: grabbing; }
  .txt { flex: 1; line-height: 1.5; word-break: break-word; user-select: text; -webkit-user-select: text; }
  .txt a.lnk { color: #d9c9a3; text-decoration: none; border-bottom: 1px dashed rgba(217,201,163,0.6); cursor: pointer; }
  .txt a.lnk:hover { color: #e8dcc0; border-bottom-style: solid; }
  .item.parent .txt { font-weight: 600; }
  .time { font-size: 10.5px; color: var(--subtext); flex-shrink: 0; margin-top: 2px; }
  .bolt {
    flex-shrink: 0; margin-top: 1px; min-width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
    transition: opacity .15s, background .15s;
    background: none; border: none; color: var(--accent2); padding: 0; border-radius: 6px;
  }
  .item:hover .bolt { opacity: 1; }
  .bolt:hover { background: rgba(228,235,244,0.10); }
  /* ▶/⏸ 「做」按钮（任务行，全层级）—— ▶=U+25B6 ⏸=U+23F8 文本字形，吃 CSS color */
  .do-btn {
    flex-shrink: 0; margin-top: 1px; min-width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
    transition: opacity .15s, background .15s;
    background: none; border: none; color: #4ade80; padding: 0; border-radius: 6px;
  }
  .item:hover .do-btn { opacity: 1; }
  .do-btn:hover { background: rgba(228,235,244,0.10); }
  .item.doing .do-btn { opacity: 1; color: #fbbf24; }
  /* 「做」进行中：深红呼吸边框 + 外发光（固定 box-shadow，只动 opacity，走合成层丝滑不卡）*/
  .item.doing { position: relative; background: rgba(220,38,38,0.05); }
  .item.doing::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 10px;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(220,38,38,0.90), 0 0 14px rgba(239,68,68,0.40);
    animation: doBreath 2.6s ease-in-out infinite;
  }
  @keyframes doBreath {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
  }
  .empty { padding: 20px 14px; text-align: center; color: rgba(154,160,181,0.6); font-size: 12px; }
  .inline-input {
    display: block; box-sizing: border-box; width: 100%; flex: 1 1 auto; min-width: 0;
    background: rgba(0,0,0,0.25); border: 1px solid rgba(217,201,163,0.5); border-radius: 6px;
    color: var(--text); font-size: 13px; line-height: 1.5; padding: 3px 8px; outline: none; font-family: inherit;
    resize: none; overflow: hidden; word-break: break-word;
  }
  .footer {
    height: 40px; border-top: 1px solid #ab9a6e; box-shadow: 0 -1px 8px rgba(217,201,163,.4), 0 -1px 20px rgba(217,201,163,.18); display: flex; align-items: center;
    justify-content: flex-end; padding: 0 14px; font-size: 11px; color: var(--subtext);
    user-select: none; -webkit-user-select: none; flex-shrink: 0;
  }
  .footer .btns { display: flex; gap: 2px; }
  .footer button { background: none; border: none; color: var(--subtext); cursor: pointer; font-size: 11px; padding: 4px 8px; border-radius: 6px; font-family: inherit; }
  .footer button:hover { color: #fff; background: rgba(228,235,244,0.10); }
  .work-btn { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; padding: 4px 14px; border-radius: 999px; border: 1px solid #5a4d2e; background: rgba(30,33,45,0.55); color: var(--subtext); font-size: 12px; cursor: pointer; font-family: inherit; transition: all .3s; flex-shrink: 0; }
  .work-btn .w-flame { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; filter: grayscale(1) opacity(0.4); transition: filter .3s; flex-shrink: 0; }
  .work-btn .w-flame svg { display: block; overflow: visible; }
  .work-btn .w-label { line-height: 1.5; }
  .work-btn:hover { border-color: #ab9a6e; color: #fff; background: rgba(30,33,45,0.8); }
  .work-btn.working { border-color: rgba(239,68,68,0.6); box-shadow: 0 0 14px rgba(239,68,68,0.25); }
  .work-btn.working .w-flame { filter: none; animation: flameBreath 2.6s ease-in-out infinite; }
  .work-btn.working .w-label { color: #f87171; }
  @keyframes flameBreath { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  #habit-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 6px; border-radius: 999px;
    font-size: 12px; line-height: 1; cursor: pointer; font-weight: 600;
    margin-left: 8px; font-family: inherit; transition: all .25s; flex-shrink: 0;
    position: relative; overflow: hidden; user-select: none;
    background: rgba(255,255,255,0.04); border: 1px solid #5a4d2e; color: #e8dcc0;
  }
  #habit-btn:hover { border-color: #d9c9a3; }
  #habit-btn.active { outline: 1px solid rgba(217,201,163,.55); outline-offset: 1px; }
  #habit-btn .kf-ico { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
  #habit-btn .kf-ico svg { display: block; overflow: visible; }
  #habit-btn .kf-lv { font-size: 12px; font-weight: 700; letter-spacing: .3px; }
  #habit-btn .kf-core-warmth { position: absolute; left: 50%; top: 58%; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  #habit-btn.kf-shimmer::after {
    content: ""; position: absolute; top: -50%; left: -60%; width: 45%; height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.30), transparent);
    transform: rotate(25deg); animation: kfShimmer 3.2s infinite ease-in-out; pointer-events: none;
  }
  .topbar.kf-topbar-shimmer::after {
    content: ""; position: absolute; top: 0; left: -60%; width: 42%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.20), transparent);
    transform: skewX(-18deg); animation: kfTopbarShimmer 3.2s infinite ease-in-out; pointer-events: none;
  }
  @keyframes kfTopbarShimmer { 0% { left: -60%; } 45%, 100% { left: 130%; } }
  /* 火花 SVG 动画 */
  @keyframes kfShimmer { 0% { left: -60%; } 45%, 100% { left: 130%; } }
  @keyframes kfPulse { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.08); opacity: 1; } }
  @keyframes kfFlameFlicker { 0%, 100% { transform: scaleY(1) skewX(0deg); } 33% { transform: scaleY(1.06) skewX(-2deg); } 66% { transform: scaleY(.96) skewX(2deg); } }
  @keyframes kfSpinCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes kfSpinCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes kfLightning { 0%, 80%, 100% { opacity: .2; } 40%, 45% { opacity: 1; } 85%, 90% { opacity: .95; } }
  .svg-pulse { transform-origin: 12px 12px; animation: kfPulse 2.4s infinite ease-in-out; }
  .svg-flicker { transform-origin: 12px 18px; animation: kfFlameFlicker 1.6s infinite ease-in-out; }
  .svg-spin-cw { transform-origin: 12px 12px; animation: kfSpinCW 8s infinite linear; }
  .svg-spin-ccw { transform-origin: 12px 12px; animation: kfSpinCCW 6s infinite linear; }
  .svg-bolt { animation: kfLightning 1.8s infinite; }
  /* 进化图鉴 */
  .streak { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .streak span { margin-left: 0; }
  .kf-big-ico { display: inline-flex; width: 28px; height: 28px; }
  .kf-big-ico svg { overflow: visible; }
  .kf-gallery { margin: 10px 2px 2px; }
  .kf-gallery-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .kf-gallery-toggle { cursor: pointer; color: #ab9a6e; font-size: 13px; line-height: 1; user-select: none; flex-shrink: 0; }
  .kf-gallery-title { font-size: 12px; color: #ab9a6e; letter-spacing: .5px; }
  .kf-theme-toggle { display: inline-flex; border: 1px solid #5a4d2e; border-radius: 999px; overflow: hidden; flex-shrink: 0; margin-left: auto; }
  .kf-theme-toggle button { background: transparent; border: none; color: #8a7a52; font-size: 11px; padding: 3px 10px; cursor: pointer; font-family: inherit; }
  .kf-theme-toggle button.on { background: rgba(217,201,163,.16); color: #e8dcc0; }
  .kf-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .kf-card {
    width: 86px; padding: 8px 5px 7px; border: 1px solid #2a2416; border-radius: 11px;
    background: #08080c; text-align: center; cursor: pointer; transition: all .15s; position: relative;
  }
  .kf-card:hover { border-color: #ab9a6e; }
  .kf-card.cur { border-color: #d9c9a3; box-shadow: 0 0 8px rgba(217,201,163,.2); }
  .kf-card .kf-ico { height: 36px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; position: relative; }
  .kf-card.locked .kf-ico { opacity: .32; filter: grayscale(1); }
  .kf-card.locked .kf-name { color: #6a6452; }
  .kf-card.locked .kf-days { color: #8a7a52; }
  .kf-lock { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; color: var(--accent); }
  .kf-lock svg { width: 100%; height: 100%; display: block; }
  .kf-lock-inline { display: inline-flex; width: 11px; height: 11px; color: var(--accent); vertical-align: -1px; margin-right: 2px; }
  .kf-lock-inline svg { width: 100%; height: 100%; display: block; }
  .kf-preview-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 30; }
  .kf-preview-mask.show { display: flex; }
  .kf-preview-card { background: #08080c; border: 1px solid #ab9a6e; border-radius: 18px; padding: 26px 34px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  .kf-preview-ico { width: 120px; height: 120px; margin: 0 auto 14px; }
  .kf-preview-ico svg { width: 100%; height: 100%; overflow: visible; }
  .kf-preview-name { font-size: 15px; font-weight: 700; color: #fff; }
  .kf-preview-days { font-size: 12px; color: #ab9a6e; margin-top: 4px; }
  .kf-card .kf-ico svg { overflow: visible; }
  .kf-card .kf-name { font-size: 11px; color: #e8dcc0; }
  .kf-card .kf-days { font-size: 10px; color: #8a7a52; margin-top: 2px; }
  .kf-card.unlit .kf-name { color: #5a5242; }
  .kf-card .kf-warmth { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; }
  .habit-head { padding: 6px 4px 12px; text-align: center; border-bottom: 1px solid var(--kf-deco, #5a4d2e); margin-bottom: 6px; }
  .streak { font-size: 26px; font-weight: 700; color: #fbbf24; }
  .streak span { font-size: 12px; color: var(--subtext); font-weight: 400; margin-left: 4px; }
  .streak-sub { font-size: 11.5px; color: var(--subtext); margin-top: 4px; }
  #toast {
    position: absolute; top: 54px; left: 50%; transform: translateX(-50%);
    background: rgba(30,33,45,0.95); border: 1px solid rgba(203,214,226,0.45); color: var(--text);
    padding: 7px 14px; border-radius: 999px; font-size: 12px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 10; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; }
  #undo-bar {
    display: none; align-items: center; gap: 10px;
    height: 38px; flex-shrink: 0; padding: 0 10px 0 14px;
    border-top: 1px solid #5a4d2e;
    background: rgba(0,0,0,0.35);
  }
  #undo-bar.show { display: flex; }
  #undo-text { color: var(--subtext); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #undo-btn { background: none; border: 1px solid #8a7752; color: #d9c9a3; cursor: pointer; padding: 3px 12px; border-radius: 999px; font-size: 12px; font-family: inherit; flex-shrink: 0; }
  #undo-btn:hover { color: #fff; border-color: #d9c9a3; background: rgba(217,201,163,.12); }
  .timer-btn {
    flex-shrink: 0; margin-top: 1px; min-width: 20px; height: 20px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; cursor: pointer; opacity: 0;
    transition: opacity .15s, background .15s;
    background: none; border: none; color: var(--accent); padding: 0; border-radius: 6px;
  }
  .item:hover .timer-btn { opacity: 1; }
  .timer-btn:hover { background: rgba(228,235,244,0.10); }
  .item.focus .timer-btn { opacity: 1; }
  /* ⏱=U+23F1 文本默认字形（无 VS16），吃 CSS color，直接染色即可；别加 background/border 把它框成方块。
     计时=红、循环提醒=黄、两者同时=红→黄渐变（background-clip:text，.both） */
  .timer-btn.live { color: #dc2626; animation: liveBreath 2.6s ease-in-out infinite; }
  @keyframes liveBreath {
    0%, 100% { opacity: 0.30; }
    50% { opacity: 1; }
  }
  .timer-btn.remind { color: #fbbf24; opacity: 1; }
  .timer-btn.both {
    opacity: 1;
    background: linear-gradient(90deg, #f87171, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  /* 秒表跑 = 青脉冲（与倒计时 live 红互斥，前端只加其一）*/
  .timer-btn.pulse { color: #d9c9a3; opacity: 1; animation: swPulse 1.6s ease-in-out infinite; }
  @keyframes swPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .focus-badge {
    flex-shrink: 0; margin-top: 2px; font-size: 10.5px; color: var(--accent2);

<script>

  var lastStateDate = null;   // 上次渲染的查看日期，变了就清空临时交互状态

const SPARK_LEVELS = [

  { lv: 2, days: 3,   nameA: "青铜燃刃", nameC: "猩红猎火", color: "#FF7A33" },
  { lv: 3, days: 7,   nameA: "白银双翼", nameC: "爆裂熔岩", color: "#FFB347" },
  { lv: 4, days: 14,  nameA: "曜金三叉", nameC: "赤金狂焰", color: "#FFD700" },

  { lv: 10, days: 180, nameA: "超凡神环", nameC: "混沌帝炎", color: "#FFF6A9" }

function getLevelByStreak(streak) {
  if (!streak || streak <= 0) return 0;
  let lv = 1;
  for (const item of SPARK_LEVELS) {
    if (streak >= item.days) lv = item.lv;
  }
  return lv;
}

/**

}
function loadData() {

}

function getDay(date) {

}

/* ============ 时间工具 ============ */
function nowSec() { return Math.floor(Date.now() / 1000); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dateStr(ts) { var d = new Date(ts * 1000); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return dateStr(nowSec()); }
function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayEpoch(dstr) { return Math.floor(new Date(dstr + 'T00:00:00').getTime() / 1000); }

/* ============ 树操作 ============ */
function dlFindNode(list, text, created) {
  for (var i = 0; i < list.length; i++) {
    var n = list[i];
    if (n.text === text && n.created === created) return { node: n, parent: list, idx: i };
    var r = dlFindNode(n.children || [], text, created);
    if (r) return r;
  }
  return null;
}
function newTaskNode(text, created) {
  return { text: text, done: false, created: created, done_time: null, start_time: null,
    focus: 0, spent: 0, review_state: null, fail_reason: null, review_note: null,
    degrade_note: null, postponed: null, plan: null, moved: null, yesterday: null,
    audio: [], images: [], files: [], children: [], collapsed: false };
}
function newIdeaNode(text, created) {
  return { text: text, time: created, created: created, focus: 0, spent: 0, start_time: null,
    audio: [], images: [], files: [], assoc: null, fail_reason: null, review_state: null,
    review_note: null, plan: null, children: [], collapsed: false };
}
function kindList(target) {
  if (target === 'task') return getDay(D.activeDate || todayStr()).tasks;
  if (target === 'idea') return getDay(D.activeDate || todayStr()).ideas;
  return getDay(D.activeDate || todayStr()).news;
}

function addEntry(target, text, parent, atts) {
  var date = D.activeDate || todayStr();
  var day = getDay(date);
  var isToday = (date === todayStr());
  var node;
  if (target === 'task') {
    node = newTaskNode(text, nowHM());
  } else {
    node = newIdeaNode(text, nowHM());
    if (!isToday && dayEpoch(date) > dayEpoch(todayStr())) node.plan = todayStr();
  }
  if (atts && atts.length) {
    for (var i = 0; i < atts.length; i++) {
      var nm = atts[i];
      if (/\.(png|jpe?g|gif|webp)$/i.test(nm)) node.images.push(nm);
      else if (/\.(m4a|mp3|wav|aac)$/i.test(nm)) node.audio.push(nm);
      else node.files.push(nm);
    }
  }
  if (parent && parent.text && parent.created) {
    var r = dlFindNode(kindList(target), parent.text, parent.created);
    if (r) { r.node.children.push(node); return true; }
  }
  kindList(target).push(node);
  return true;
}

function deleteEntryTree(target, text, key) {
  var list = kindList(target);
  var r = dlFindNode(list, text, key);
  if (!r) return false;
  r.parent.splice(r.idx, 1);
  return true;
}

function setEntryDone(target, text, created, toDone) {
  // 任务勾选/取消，附带计时结算（等价 Lua set_done）
  var list = getDay(D.activeDate || todayStr()).tasks;
  var r = dlFindNode(list, text, created);
  if (!r) return false;
  var fs = D.focusSession;
  var focusMin = null, doingRec = null, swRec = null;
  if (toDone) {
    if (fs && !fs.ringed && fs.kind === 'task' && fs.taskText === text && fs.taskCreated === created) {
      focusMin = nowSec() - fs.startTs;
    }
    var dk = nodeKey(text, created);
    doingRec = D.doing[dk] || null;
    swRec = D.stopwatches[dk] || null;
  }
  r.node.done = toDone;
  r.node.done_time = toDone ? nowHM() : null;
  if (focusMin) r.node.focus += Math.max(1, focusMin);
  if (swRec) {
    var sws = elapsedSec(swRec.startEpoch);
    r.node.focus += sws;
    r.node.spent += sws;
  } else if (doingRec) {
    r.node.spent += elapsedSec(doingRec.startEpoch);
  }
  // 清理会话
  if (focusMin) D.focusSession = null;
  if (doingRec) delete D.doing[nodeKey(text, created)];
  if (swRec) delete D.stopwatches[nodeKey(text, created)];
  return true;
}

function editEntry(target, text, key, newText) {
  var list = kindList(target);
  var r = dlFindNode(list, text, key);
  if (!r) return false;
  var old = r.node.text;
  r.node.text = newText;
  // 迁移计时会话里的 text
  var fs = D.focusSession;
  if (fs && fs.taskText === old) fs.taskText = newText;
  var dk = nodeKey(text, key), nk = nodeKey(newText, key);
  if (D.doing[dk]) { D.doing[nk] = D.doing[dk]; D.doing[nk].text = newText; delete D.doing[dk]; }
  if (D.stopwatches[dk]) { D.stopwatches[nk] = D.stopwatches[dk]; D.stopwatches[nk].text = newText; delete D.stopwatches[dk]; }
  return true;
}

function moveEntry(src, dst) {
  // src/dst: {text, created}；dst 为 null = 移到顶层
  var list = kindList('task');
  var s = dlFindNode(list, src.text, src.created);
  if (!s) return 'notfound';
  // 防循环：dst 不能在 src 子树内
  var dNode = dst ? dlFindNode(list, dst.text, dst.created) : null;
  if (dNode) {
    var p = s;
    while (p) {
      if (p.node === dNode.node) return 'cycle';
      p = null;
    }
    // 简单防循环：dst 是 src 的后代
    if (isDescendant(dNode.node, s.node)) return 'cycle';
    if (dNode.node === s.node) return 'same';
  }
  var sub = s.parent.splice(s.idx, 1)[0];

}

    if (isDescendant(kids[i], node)) return true;
  }
  return false;
}

function toTaskFromIdea(text, key) {

  if (!src) return false;
  var sub = src.parent.splice(src.idx, 1)[0];

}

function setReview(target, text, key, note) {

}

  var folds = D.folds[date] || {};
  (function walk(arr) {
    (arr || []).forEach(function(n) {
      n.collapsed = !!folds[nodeKey(n.text, n.created)];
      walk(n.children);
    });
  })(list);
  return list;
}

/* ============ 微习惯 ============ */
function habitStateToday() {

  var out = [];

}

}

}

/* ============ 计时 ============ */
function doingToday() {

  for (var k in D.doing) { if (D.doing[k].date === todayStr()) out.push(D.doing[k]); }
  return out;
}
function swToday() {

  return out;
}
function startDoing(text, created) {

}
function stopDoing(text, created) {

  var list = getDay(todayStr()).tasks;

function startStopwatch(kind, text, created) {

}

  var list = kindList(kind);
  var r = dlFindNode(list, text, created);

function startFocus(text, created, kind, minutes) {

  D.focusSession = {

    startTs: nowSec(), endTs: nowSec() + minutes * 60, durationMin: minutes, ringed: false
  };
}

  var secs = Math.max(1, nowSec() - fs.startTs);
  var list = (fs.kind === 'task') ? getDay(todayStr()).tasks : kindList(fs.kind);
  var r = dlFindNode(list, fs.taskText, fs.taskCreated);
  if (r) {
    r.node.focus += secs;
    r.node.spent += secs;
    if (!r.node.start_time) r.node.start_time = nowHM();
  }
  D.focusSession = null;
}
function startHabitFocus(index, minutes) {

    startTs: nowSec(), endTs: nowSec() + minutes * 60, durationMin: minutes, ringed: false

}

  for (var k in D.reminders) out[k] = D.reminders[k].intervalMin;
  return out;
}

/* ============ 上下班（跨午夜分账） ============ */
function startWork() {
  if (D.work.active) stopWork();
  D.work.active = true;
  D.work.startTs = nowSec();
  D.work.date = todayStr();
  D.work.overnight = false;
}
function stopWork() {
  var w = D.work;
  if (!w.active) return;
  var now = nowSec();
  var d = w.date, ts = w.startTs;
  while (dayEpoch(d) < startOfTodaySec()) {
    var dayEnd = dayEpoch(d) + 86400;
    D.workDurations[d] = (D.workDurations[d] || 0) + (dayEnd - ts);
    d = nextDate(d); ts = dayEnd;
  }
  D.workDurations[d] = (D.workDurations[d] || 0) + (now - ts);
  // 熬夜：跨过午夜后到下班之间的时长记入当天 overnight
  if (w.date !== todayStr()) {
    var ov = now - startOfTodaySec();
    if (ov > 0) D.overnightDurations[todayStr()] = (D.overnightDurations[todayStr()] || 0) + ov;
  }
  w.active = false; w.startTs = null; w.date = null; w.overnight = false;
}

/* ============ streak（全部习惯完成 = 打卡成功） ============ */
function calcStreak() {
  var doneSet = {};
  var total = D.habitDefs.length;
  for (var d in D.days) {
    var hb = D.days[d].habits || [];
    var done = 0;
    for (var i = 0; i < total; i++) { if (hb[i] && hb[i].done) done++; }
    if (total > 0 && done >= total) doneSet[d] = true;
  }
  var dates = Object.keys(doneSet).sort();
  var totalDays = dates.length;
  var best = 0, cur = 0, prevE = null;
  for (var i = 0; i < dates.length; i++) {
    var e = dayEpoch(dates[i]);
    if (prevE && e === prevE + 86400) cur++; else cur = 1;
    if (cur > best) best = cur;
    prevE = e;
  }
  var streak = 0;
  var t = dayEpoch(todayStr());
  if (!doneSet[todayStr()]) t -= 86400;
  while (doneSet[dateStr(t)]) { streak++; t -= 86400; }
  return { streak: streak, total: totalDays, best: best };
}

/* ============ 日期列表 ============ */
function listDailyDates() {
  var out = {};
  for (var d in D.days) { if (D.days[d].tasks.length || D.days[d].ideas.length || D.days[d].news.length) out[d] = true; }
  return out;
}
function getAudioDurations() {
  var out = {};
  for (var n in D.audioData) out[n] = D.audioData[n].duration || 0;
  return out;
}

/* ============ buildState ============ */
function buildState() {
  var date = D.activeDate || todayStr();
  var day = D.days[date] || { tasks: [], ideas: [], news: [], habits: [] };
  var isToday = (date === todayStr());
  var tasks = applyFolds(JSON.parse(JSON.stringify(day.tasks || [])), date);
  var ideas = applyFolds(JSON.parse(JSON.stringify(day.ideas || [])), date);
  var news = applyFolds(JSON.parse(JSON.stringify(day.news || [])), date);
  var fs = D.focusSession;
  var focus = null, habit_focus = null, focus_timing = null;
  if (isToday && fs && !fs.ringed) {
    if (fs.kind === 'task' || fs.kind === 'idea' || fs.kind === 'new') {
      focus = { text: fs.taskText, created: fs.taskCreated, kind: fs.kind };
    } else if (fs.kind === 'habit') {
      habit_focus = fs.habitIndex;
    }
    focus_timing = {
      kind: fs.kind, text: fs.taskText || fs.habitText, key: fs.taskCreated,
      habit_index: fs.habitIndex, start_ts: fs.startTs,
      left: Math.max(0, (fs.endTs || 0) - nowSec()), total: (fs.durationMin || 0) * 60
    };
  }
  var w = D.work;
  var work_sec = D.workDurations[date] || 0;
  var overnight_sec = D.overnightDurations[date] || 0;
  var work_live_start = 0, work_overnight = false;
  if (w.active && w.date === date) { work_live_start = w.startTs; work_overnight = w.overnight; }
  return {
    type: 'state', date: date, today: todayStr(), is_today: isToday, weekday: weekdayCN(date),
    tasks: tasks, ideas: ideas, news: news,
    focus: focus, habit_focus: habit_focus, focus_timing: focus_timing,
    doing: isToday ? doingToday() : [],
    stopwatches: isToday ? swToday() : [],
    habits: isToday ? habitStateToday() : [],
    habit_streak: calcStreak(),
    spark_theme: D.sparkTheme || 'C',
    reminders: reminderIntervals(),
    audio_durations: getAudioDurations(),
    daily_dates: listDailyDates(),
    work_active: w.active, work_sec: work_sec, overnight_sec: overnight_sec,
    work_live_start: work_live_start, work_overnight: work_overnight
  };
}

/* ============ 撤回删除 ============ */
var lastDelete = null;
function snapshotDelete(target, text, key) {

  r.parent.splice(r.idx, 1);

/* ============ 录音/附件（基础：MediaRecorder + base64） ============ */

      try {
        var mime = 'audio/mp4';
        if (!MediaRecorder.isTypeSupported('audio/mp4')) {
          mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        }
        mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        mediaChunks = [];
        mediaRecorder.ondataavailable = function(e) { if (e.data.size) mediaChunks.push(e.data); };
        mediaRecorder.onstop = onRecordStop;
        mediaRecorder.start();
        mediaStartTs = nowSec();
        window.__onLuaMessage({ type: 'recording_state', recording: true });
      } catch(e) { toast('录音启动失败'); }
    }).catch(function() { toast('麦克风权限被拒'); });
  } else {
    toast('此浏览器不支持录音');
  }

  var reader = new FileReader();
  reader.onload = function() {
    D.audioData[name] = { dataUrl: reader.result, duration: dur };
    // 挂到录音上下文（复盘对象或 pending）
    var ctx = recContext || {};
    if (ctx.target && ctx.text && ctx.key) {
      var list = kindList(ctx.target);
      var r = dlFindNode(list, ctx.text, ctx.key);
      if (r) r.node.audio.push(name);
    }
    mediaRecorder = null;
    saveData();
    window.__onLuaMessage({ type: 'recording_state', recording: false });

  };
  reader.readAsDataURL(blob);
}
function recordStop() {

}
function playAudio(name) {

  var audio = new Audio(a.dataUrl);
  audio.play();
}
function removeAudio(target, text, key, name) {

  if (D.audioData[name]) delete D.audioData[name];
}

  }

var pendingAtts = [];

function removeAttachment(target, text, key, name) {

    r.node.files = (r.node.files || []).filter(function(x) { return x !== name; });
  }

}

/* ============ 周报/月报（本地算） ============ */
function buildReport(days) {
  var n = days || 7;
  var lines = [];
  var totalFocus = 0, totalSpent = 0, totalDone = 0, totalTasks = 0, totalRec = 0;
  for (var i = 0; i < n; i++) {
    var d = dateStr(dayEpoch(todayStr()) - i * 86400);
    var day = D.days[d];
    if (!day) continue;
    var f = 0, s = 0, done = 0, cnt = 0, rec = 0;
    (function walk(arr) {
      (arr || []).forEach(function(t) {
        cnt++;
        f += t.focus || 0; s += t.spent || 0;
        if (t.done) done++;
        if (t.review_note) rec++;
        walk(t.children);
      });
    })(day.tasks);
    totalFocus += f; totalSpent += s; totalDone += done; totalTasks += cnt; totalRec += rec;
    lines.push(d + '：任务 ' + cnt + ' / 完成 ' + done + ' / 专注 ' + reportDur(f) + ' / 投入 ' + reportDur(s));
  }
  var head = '近 ' + n + ' 天战报\n\n' + lines.join('\n');
  head += '\n\n合计：任务 ' + totalTasks + ' / 完成 ' + totalDone + ' / 专注 ' + reportDur(totalFocus) + ' / 投入 ' + reportDur(totalSpent) + ' / 复盘 ' + totalRec;
  return head;
}
function reportDur(sec) {
  sec = Math.max(0, Math.floor(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 0) return h + 'h' + m + 'm';
  if (m > 0) return m + '分';
  return sec + '秒';
}

/* ============ handleAction（等价 Lua usercontent 分发） ============ */
function handleAction(action, body) {
  body = body || {};
  switch (action) {
    case 'toggle_lock': break;
    case 'set_spark_theme':
      if (body.theme === 'A' || body.theme === 'C') { D.sparkTheme = body.theme; refreshState(); }
      break;
    case 'work_start':
      startWork(); saveData(); refreshState();
      window.__onLuaMessage({ type: 'toast', text: '🔥 开始工作，加油' });
      break;
    case 'work_stop':
      stopWork(); saveData(); refreshState();
      window.__onLuaMessage({ type: 'toast', text: '🌙 已下班，今天辛苦了' });
      break;
    case 'add':
      var txt = (body.text || '').trim();
      if (txt || (body.attachments && body.attachments.length)) {
        if (!txt && body.attachments) txt = body.attachments[0];
        if (txt) {
          addEntry(body.target, txt, body.parent, body.attachments);
          saveData(); refreshState();
          window.__onLuaMessage({ type: 'toast', text: '✅ 已记入' });
        }
      }
      break;
    case 'toggle_fold':
      var fdate = D.activeDate || todayStr();
      if (!D.folds[fdate]) D.folds[fdate] = {};
      var fk = nodeKey(body.text, body.created);
      if (body.collapsed) D.folds[fdate][fk] = true; else delete D.folds[fdate][fk];
      saveData(); refreshState();
      break;
    case 'move_entry':
      var code = moveEntry(body.source || {}, body.dest || null);
      if (code === 'ok') { saveData(); refreshState(); }
      else if (code === 'cycle') window.__onLuaMessage({ type: 'toast', text: '⚠️ 不能拖进它自己的子任务里' });
      else if (code === 'same') window.__onLuaMessage({ type: 'toast', text: '⚠️ 已经在这里了' });
      else window.__onLuaMessage({ type: 'toast', text: '⚠️ 没找到原任务' });
      break;
    case 'set_habit_done':
      if (setHabitDone(parseInt(body.index, 10), !!body.done)) { saveData(); refreshState(); }
      break;
    case 'add_habit':
      var ht = (body.text || '').trim();
      if (ht) { addHabit(ht); saveData(); refreshState(); window.__onLuaMessage({ type: 'toast', text: '✅ 已加入微习惯' }); }
      break;
    case 'delete_habit':
      if (deleteHabit(parseInt(body.index, 10))) { saveData(); refreshState(); window.__onLuaMessage({ type: 'toast', text: '🗑 已删除微习惯' }); }
      break;
    case 'edit_habit':
      var nt = (body.new_text || '').trim();
      if (nt) { editHabit(parseInt(body.index, 10), nt); saveData(); refreshState(); window.__onLuaMessage({ type: 'toast', text: '✏️ 已改名' }); }
      break;
    case 'set_done':
      if (setEntryDone(body.target || 'task', body.text, body.created, !!body.done)) { saveData(); refreshState(); }
      break;
    case 'start_focus':
      var mins = parseInt(body.minutes, 10);
      if (body.text && body.created && mins > 0 && mins <= 1440) {
        startFocus(body.text, body.created, body.kind || 'task', mins);
        saveData(); refreshState();
      }
      break;
    case 'stop_focus':
      stopFocus(body.text, body.created); saveData(); refreshState();
      break;
    case 'start_habit_focus':
      var hm = parseInt(body.minutes, 10);
      if (body.index && hm > 0) { startHabitFocus(parseInt(body.index, 10), hm); saveData(); refreshState(); }
      break;
    case 'start_reminder':
      var rm = parseInt(body.minutes, 10);
      if (body.key && rm > 0) { startReminder(body.key, rm); saveData(); refreshState(); }
      break;
    case 'stop_reminder':
      if (body.key) { stopReminder(body.key); saveData(); refreshState(); }
      break;
    case 'start_doing':
      startDoing(body.text, body.created); saveData(); refreshState();
      break;
    case 'stop_doing':
      stopDoing(body.text, body.created); saveData(); refreshState();
      break;
    case 'start_stopwatch':
      startStopwatch(body.kind || 'task', body.text, body.created); saveData(); refreshState();
      break;
    case 'stop_stopwatch':
      stopStopwatch(body.kind || 'task', body.text, body.created); saveData(); refreshState();
      break;
    case 'delete_entry':
      if (snapshotDelete(body.target, body.text, body.key)) {
        saveData(); refreshState();
        window.__onLuaMessage({ type: 'undo_available', text: body.text });
      }
      break;
    case 'undo_delete':
      if (undoDelete()) { saveData(); refreshState(); }
      break;
    case 'edit':
      var key = body.key || body.created;
      var old = body.old_text || body.text;
      if (editEntry(body.target, old, key, (body.new_text || '').trim())) { saveData(); refreshState(); }
      break;
    case 'to_task':
      if (toTaskFromIdea(body.text, body.key)) { saveData(); refreshState(); }
      break;
    case 'review_save':
      setReview(body.target, body.text, body.key, body.note); saveData(); refreshState();
      break;
    case 'report':
      window.__onLuaMessage({ type: 'report', text: buildReport(parseInt(body.days, 10) || 7) });
      break;
    case 'report_ai':
      window.__onLuaMessage({ type: 'report_ai', text: buildReport(parseInt(body.days, 10) || 7) });
      break;
    case 'record_start':
      recordStart(body); break;
    case 'record_stop':
      recordStop(); break;
    case 'play_audio':
      playAudio(body.file); break;
    case 'remove_audio':
      removeAudio(body.target, body.text, body.key, body.file); saveData(); refreshState();
      break;
    case 'undo_recording':
      undoRecording(); saveData(); refreshState();
      break;
    case 'paste_attach':
    case 'pick_file':
      pickFile(); break;
    case 'discard_staged':
      discardStaged(body.name); saveData();
      break;
    case 'remove_attachment':
      removeAttachment(body.target, body.text, body.key, body.file); saveData(); refreshState();
      break;
    case 'open_attachment':
      openAttachment(body.file); break;
    case 'set_attach_ctx':
      recContext = body || {}; break;
    case 'attach_staged_to_entry':
      attachStaged(body.target, body.text, body.key, body.names); saveData(); refreshState();
      break;
    case 'copy_text':
      if (body.text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(body.text);
        }
        window.__onLuaMessage({ type: 'toast', text: '📋 已复制' });
      }
      break;
    case 'open_url':
      if (body.url && /^https?:\/\//.test(body.url)) window.open(body.url, '_blank');
      break;
    case 'open_obsidian': break;
    case 'switch_date':
      D.activeDate = body.date || null;
      saveData(); refreshState();
      break;
    case 'drag_start': break;
    case 'focus_self': break;
    case 'close': break;
    case 'ready': break;
  }
}

      var tail = raw.slice(clean.length);
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement('a');
      a.className = 'lnk';

      a.onmousedown = (function(u) {

      frag.appendChild(a);

          if (x.text === reviewTarget.text && x.time === reviewTarget.key) { it = x; return; }
          if (!it) walk(x.children);
        });
      })(src);
      if (it) {
        reviewTarget.audios = it.audio || [];
        reviewTarget.review_note = it.review_note || '';
        reviewTarget.done = false;
      } else {
        reviewTarget = null;
      }
    }
  }

  var inlineEdit = null;  // { ed, ta, node, kind, key, row } 行内展开的复盘编辑器
  function closeInlineEdit(save) {
    if (!inlineEdit) return;
    var ie = inlineEdit;
    inlineEdit = null;
    var val = ie.ta.value.trim();
    var changed = val !== (ie.node.review_note || '');
    ie.ed.remove();
    if (save && changed) {
      post('review_save', { target: ie.kind, text: ie.node.text, key: ie.key, note: val });
      ie.node.review_note = val;
    }
  }
  function openInlineReview(node, kind, key, afterEl, opts) {
    opts = opts || {};
    closeInlineEdit(true);
    closeAttachPanel();
    var ed = document.createElement('div');
    ed.className = 'review-inline';
    var ta = document.createElement('textarea');
    ta.className = 'review-inline-ta';
    ta.value = (opts.value !== undefined) ? opts.value : (node.review_note || '');
    ta.placeholder = '写一句复盘…';
    ed.appendChild(ta);
    if (node.audio && node.audio.length) {
      var au = document.createElement('div');
      au.className = 'review-inline-audios';
      audioCapsule(au, node.audio, { target: kind, text: node.text, key: key }, { max: 3 });
      ed.appendChild(au);
    }
    afterEl.insertAdjacentElement('afterend', ed);
    inlineEdit = { ed: ed, ta: ta, node: node, kind: kind, key: key, row: afterEl };
    ta.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !imeBlocking(e)) { e.preventDefault(); closeInlineEdit(true); }
      else if (e.key === 'Tab') {
        e.preventDefault();
        var s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.substring(0, s) + '\n' + ta.value.substring(en);
        ta.selectionStart = ta.selectionEnd = s + 1;
      }
      else if (e.key === 'Escape') { e.preventDefault(); closeInlineEdit(false); }
    });
    bindIme(ta);
    if (!opts.skipFocus) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }

  function findRow(anchor) {
    var rows = document.querySelectorAll('.item');
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].dataset.anchor === anchor) return rows[i];
    }
    return null;
  }
  function reopenInlineEdit(info) {
    var node = null, row = null, anchor = null;
    if (info.kind === 'task') {
      (function walk(nodes) {
        (nodes || []).forEach(function(n) {
          if (n.text === info.text && n.created === info.key) { node = n; return; }
          if (!node) walk(n.children);
        });
      })(state.tasks);
      if (node) anchor = 'task\u0001' + node.created + '\u0001' + node.text;
    } else if (info.kind === 'habit') {
      (state.habits || []).forEach(function(h) {
        if (h.text === info.key) { node = h; anchor = 'habit\u0001' + h.text; }
      });
    } else if (info.kind === 'idea' || info.kind === 'new') {
      var src = info.kind === 'idea' ? state.ideas : state.news;
      (function walk(nodes) {
        (nodes || []).forEach(function(it) {
          if (it.text === info.text && it.time === info.key) { node = it; anchor = info.kind + '\u0001' + it.time + '\u0001' + it.text; return; }
          if (!node) walk(it.children);
        });
      })(src);
    }
    if (node && anchor) row = findRow(anchor);
    if (node && row) openInlineReview(node, info.kind, info.key, row, { value: info.taValue, skipFocus: true });
  }

  function setCat(c) {
    curCat = c;
    view = 'list';
    addTarget = null; updateTargetBadge();
    var chips = document.querySelectorAll('.chip');
    chips.forEach(function(ch){ ch.classList.toggle('active', ch.dataset.cat === c); });
    render();
    el('inp').focus();
  }

  function flatten(nodes, out) {
    out = out || [];
    nodes.forEach(function(n){ out.push(n); flatten(n.children, out); });
    return out;
  }
  function lastTask() {
    var out = flatten(state.tasks, []);
    return out.length ? out[out.length - 1] : null;
  }
  function lastIdea() {
    var out = flatten(state.ideas, []);
    return out.length ? out[out.length - 1] : null;
  }
  function lastNews() {
    var out = flatten(state.news, []);
    return out.length ? out[out.length - 1] : null;
  }

  function setAddTarget(node) {
    addTarget = node ? { text: node.text, created: node.created } : null;
    reviewTarget = null;
    updateTargetBadge();
    el('inp').focus();
  }
  function clearTarget(ev) {
    if (ev) ev.stopPropagation();
    addTarget = null; updateTargetBadge();
  }
  function toggleSubTarget(n) {
    var isTarget = addTarget && addTarget.text === n.text && addTarget.created === n.created;
    if (isTarget) {
      addTarget = null;
      n.collapsed = true;
      post('toggle_fold', { text: n.text, created: n.created, collapsed: true });
    } else {
      addTarget = { text: n.text, created: n.created };
      n.collapsed = false;
      post('toggle_fold', { text: n.text, created: n.created, collapsed: false });
    }
    reviewTarget = null;
    updateTargetBadge();
    render();
    el('inp').focus();
  }
  function updateTargetBadge() {
    var b = el('target-badge');
    if (addTarget) {
      b.style.display = 'inline-flex';
      b.textContent = '↳ 加到「' + addTarget.text + '」下';
    } else {
      b.style.display = 'none';
    }
  }

  function updateHabitBtn() {
    var st = state.habit_streak || { streak: 0, total: 0, best: 0 };
    if (!state.is_today) {
      paintHabitBtn(0, null);
      el('habit-btn').title = '微习惯仅今天可打卡';
      return;
    }
    var lv = getLevelByStreak(st.streak);
    var bestLv = getLevelByStreak(st.best);
    var warmth = null;
    if (bestLv > lv && lv > 0) {
      warmth = { color: SPARK_LEVELS[bestLv - 1].color, name: sparkName(bestLv) };
    }
    paintHabitBtn(lv, warmth);
    el('habit-btn').title = '火火的微习惯 · 连续 ' + st.streak + ' 天 · 累计 ' + st.total + ' · 历史最长 ' + st.best + (lv > 0 ? ' · 当前 ' + sparkName(lv) : '');
  }

  function submitInput() {
    var val = el('inp').value.trim();
    var atts = pendingAttachments.map(function(a) { return a.name; });
    var hasAtts = atts.length > 0;
    if (reviewTarget) {
      // 复盘态：内容清空也提交，等于删掉这条复盘
      post('review_save', { target: reviewTarget.kind, text: reviewTarget.text, key: reviewTarget.key, note: val });
      if (hasAtts) {
        post('attach_staged_to_entry', { target: reviewTarget.kind, text: reviewTarget.text, key: reviewTarget.key, names: atts });
        pendingAttachments = [];
        renderPendingAttachments();
      }
      reviewTarget = null;
      el('inp').value = '';
      renderReview();
      return;
    }
    if (!val && !hasAtts) return;
    if (view === 'habit') {
      el('inp').value = '';
      inpDraft = '';
      post('add_habit', { text: val });
      return;
    }
    var target = curCat;
    var text = val;
    var m = val.match(/^([in])\s+(.+)$/);
    if (m) {
      target = (m[1] === 'i') ? 'idea' : 'new';
      text = m[2];
    }
    el('inp').value = '';
    inpDraft = '';
    pendingAttachments = [];
    renderPendingAttachments();
    var parent = ((target === 'task' || target === 'idea' || target === 'new') && addTarget) ? addTarget : null;
    post('add', { target: target, text: text, parent: parent, attachments: atts });
  }

  function nodeProgress(n) {
    if (n.children && n.children.length) {
      var s = 0;
      n.children.forEach(function(c){ s += nodeProgress(c); });
      var childAvg = s / n.children.length;
      return childAvg * 0.9 + (n.done ? 0.1 : 0);
    }
    return n.done ? 1 : 0;
  }
  function totalProgress() {
    var roots = state.tasks;
    if (!roots.length) return { pct: 0, parents: roots.length };
    var s = 0;
    roots.forEach(function(r){ s += nodeProgress(r); });
    return { pct: Math.round(s / roots.length * 100), parents: roots.length };
  }

  function renderNode(n, num, container) {
    var hasKids = n.children && n.children.length > 0;
    var wrap = document.createElement('div');
    wrap.className = 'node';

    var row = document.createElement('div');
    row.className = 'item' + (n.done ? ' done' : '') + (hasKids ? ' parent' : '');
    row.dataset.anchor = 'task\u0001' + n.created + '\u0001' + n.text;
    row.onmousedown = function(e) {
      if (!hasKids) return;
      var t = e.target;
      if (t.closest('button') || t.classList.contains('cb') || t.classList.contains('arrow') || t.classList.contains('grip')) return;
      clearTimeout(row._foldTimer);
      row._foldTimer = setTimeout(function() {
        post('toggle_fold', { text: n.text, created: n.created, collapsed: !n.collapsed });
      }, 200);
    };

    // 拖拽移动：只有最左 ⋮⋮ 抓手可拖（文字区留给双击编辑/选中复制）
    var grip = document.createElement('span');
    grip.className = 'grip';
    grip.textContent = '⋮⋮';
    grip.title = '按住拖动，移到别的任务下或列表底部空白处';
    grip.draggable = true;
    grip.addEventListener('dragstart', function(e) {
      clearTimeout(row._foldTimer);
      dragSrc = { text: n.text, created: n.created, node: wrap };
      row.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', n.text); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
    });
    grip.addEventListener('dragend', function() {
      dragSrc = null;
      document.querySelectorAll('.dragging').forEach(function(x) { x.classList.remove('dragging'); });
      document.querySelectorAll('.drop-target').forEach(function(x) { x.classList.remove('drop-target'); });
      document.querySelectorAll('.drop-root').forEach(function(x) { x.classList.remove('drop-root'); });
    });
    row.appendChild(grip);
    row.addEventListener('dragover', function(e) {
      if (!dragSrc || dragSrc.node.contains(row)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      row.classList.add('drop-target');
    });
    row.addEventListener('dragleave', function() {
      row.classList.remove('drop-target');
    });
    row.addEventListener('drop', function(e) {
      e.preventDefault(); e.stopPropagation();
      row.classList.remove('drop-target');
      if (!dragSrc || dragSrc.node.contains(row)) return;
      if (dragSrc.text === n.text && dragSrc.created === n.created) return;
      post('move_entry', { source: { text: dragSrc.text, created: dragSrc.created }, dest: { text: n.text, created: n.created } });
    });

    var ar = document.createElement('span');
    var depthLevel = Math.min((num.match(/\./g) || []).length, 4);
    ar.className = 'arrow' + (hasKids ? '' : ' leaf') + ' d' + depthLevel;
    ar.textContent = n.collapsed ? '▸' : '▾';
    if (hasKids) {
      ar.onmousedown = function() { post('toggle_fold', { text: n.text, created: n.created, collapsed: !n.collapsed }); };
    }
    row.appendChild(ar);

    var numEl = document.createElement('span');
    numEl.className = 'num';
    numEl.textContent = (num.indexOf('.') === -1) ? num : '';
    row.appendChild(numEl);

    var cb = document.createElement('div');
    cb.className = 'cb';
    cb.onmousedown = function() { post('set_done', { text: n.text, created: n.created, done: !n.done }); };
    row.appendChild(cb);

    var txtWrap = document.createElement('div');
    txtWrap.className = 'txt';
    var txt = document.createElement('span');
    txt.appendChild(linkify(n.text));
    txt.ondblclick = function() { clearTimeout(row._foldTimer); startEdit(n, 'task', txt, n.created); };
    txtWrap.appendChild(txt);
    row.appendChild(txtWrap);

    if (n.start_time) {
      var tm = document.createElement('span');
      tm.className = 'time';
      tm.textContent = n.start_time;
      row.appendChild(tm);
    }
    if (n.plan) row.appendChild(planBadge(n.plan));
    if (n.moved) row.appendChild(movedBadge(n.moved));
    if (n.yesterday) row.appendChild(yesterdayBadge(n.yesterday));

    var isLive = !!(state.focus && state.focus.kind === 'task' && state.focus.text === n.text && state.focus.created === n.created);
    var isDoing = !!(state.doing || []).some(function(d) { return d.kind === 'task' && d.text === n.text && d.key === n.created; });
    var isSw = !!(state.stopwatches || []).some(function(s) { return s.kind === 'task' && s.text === n.text && s.key === n.created; });
    if (isLive) row.className += ' focus';
    if (isDoing) row.className += ' doing';
    if (n.focus) {
      var fb = document.createElement('span');
      fb.className = 'focus-badge';
      fb.title = '累计计时 ' + fmtMinLong(n.focus);
      fb.textContent = '⏱' + fmtMinShort(n.focus);
      row.appendChild(fb);
    }

    attachBadge(row, n, 'task', n.created);

    // 1. 做键 ▶（今天 + 未完成 + 无倒计时/秒表；计时器驱动做时不可手动暂停）
    if (state.is_today && !n.done && !isLive && !isSw) {
      var db = document.createElement('button');
      db.className = 'do-btn' + (isDoing ? ' pause' : '');
      db.title = isDoing ? '暂停（结算耗时）' : '开始做';
      db.textContent = isDoing ? '⏸' : '▶';
      db.onmousedown = function() { post(isDoing ? 'stop_doing' : 'start_doing', { text: n.text, created: n.created }); };
      row.appendChild(db);
    }

    // 2. 下右拐 ↳
    var sub = document.createElement('button');
    sub.className = 'sub-btn';
    sub.title = '点一下加入子任务，再点取消并收起';
    sub.textContent = '↳';
    if (addTarget && addTarget.text === n.text && addTarget.created === n.created) sub.classList.add('active');
    sub.onmousedown = function() { toggleSubTarget(n); };
    row.appendChild(sub);

    // 3. 计时器 ⏱
    if (state.is_today) {
      var tb = document.createElement('button');
      tb.className = 'timer-btn' + (isLive ? ' live' : (isSw ? ' pulse' : ''));
      tb.title = '计时';
      tb.textContent = '⏱';
      tb.onmousedown = function() { openFocusModal(n); };
      row.appendChild(tb);
    }

    // 4. 复盘 💬
    var rb = document.createElement('button');
    rb.className = 'review-toggle' + (n.review_note ? ' on' : '');
    rb.title = n.review_note ? '展开/编辑复盘' : '复盘';
    rb.textContent = '💬';
    rb.onmousedown = function() {
      if (inlineEdit) {
        if (inlineEdit.row === row) { closeInlineEdit(true); return; }
        closeInlineEdit(true);
      }
      if (n.review_note) {
        openInlineReview(n, 'task', n.created, row);
      } else {
        addTarget = null; updateTargetBadge();
        reviewTarget = { kind: 'task', text: n.text, key: n.created, done: n.done, review_note: '', audios: n.audio || [] };
        renderReview();
        el('inp').focus();
      }
    };
    row.appendChild(rb);

    // 5. 录音播放键（如有）
    taskAudioBadge(row, n.audio);

    // 6. 垃圾桶 🗑
    var del = document.createElement('button');
    del.className = 'del-btn';
    del.title = '删除';
    del.textContent = '🗑';
    del.onmousedown = function() { handleDelete(del, 'task', n.text, n.created); };
    row.appendChild(del);

    wrap.appendChild(row);

    if (hasKids && !n.collapsed) {
      var kids = document.createElement('div');
      kids.className = 'kids';
      n.children.forEach(function(c, j) {
        renderNode(c, num + '.' + (j + 1), kids);
      });
      wrap.appendChild(kids);
    }
    container.appendChild(wrap);
  }

  function renderTasks() {
    var list = el('list');
    list.innerHTML = '';
    var tasks = state.tasks;
    var prog = totalProgress();
    el('progress').style.display = tasks.length ? 'flex' : 'none';
    el('prog-label').textContent = prog.parents + ' 个主线';
    el('prog-pct').textContent = prog.pct + '%';
    el('bar-fill').style.width = prog.pct + '%';
    if (!tasks.length) {
      list.innerHTML = '<div class="empty">还没有任务。输入框敲一条回车即记；Tab 加到上一条下面，或 hover「↳」。</div>';
    }
    tasks.forEach(function(t, i) { renderNode(t, String(i + 1), list); });
  }

  function renderIdeas() {

  // ============ 今日详情：数据战报 + 思维导图 + 树状明细表 ============
  function fmtMinLong(m) {   // 接收秒，格式化「X 小时 Y 分 Z 秒」（0 单位省略）
    m = Math.max(0, Math.round(m));
    var h = Math.floor(m / 3600), mm = Math.floor((m % 3600) / 60), s = m % 60;
    var parts = [];
    if (h > 0) parts.push(h + ' 小时');
    if (mm > 0) parts.push(mm + ' 分');
    if (s > 0 || parts.length === 0) parts.push(s + ' 秒');
    return parts.join(' ');
  }
  function fmtMinShort(m) {  // 接收秒，紧凑格式「1h20m30s」/「20m30s」/「45s」
    m = Math.max(0, Math.round(m));
    var h = Math.floor(m / 3600), mm = Math.floor((m % 3600) / 60), s = m % 60;
    if (h > 0) return h + 'h' + (mm > 0 ? mm + 'm' : '');
    if (mm > 0) return mm + 'm' + (s > 0 ? s + 's' : '');
    return s + 's';
  }

  // 自底向上 roll-up：selfMin 已有（n.focus），补 totalMin（含子孙）、子树完成度、深度
  function rollup(n, depth) {
    n.depth = depth;
    n.selfMin = n.spent || 0;       // 自身耗时（[耗时::]）
    n.selfFocus = n.focus || 0;     // 自身专注（[计时::]）
    n.totalMin = n.selfMin;         // 分支耗时
    n.branchFocus = n.selfFocus;    // 分支专注
    n.subDone = n.done ? 1 : 0;
    n.subTotal = 1;
    (n.children || []).forEach(function(c) {
      rollup(c, depth + 1);
      n.totalMin += c.totalMin;
      n.branchFocus += c.branchFocus;
      n.subDone += c.subDone;
      n.subTotal += c.subTotal;
    });
  }
  function computeDetail() {
    var roots = state.tasks || [];
    var ideaRoots = state.ideas || [];
    var newsRoots = state.news || [];
    roots.forEach(function(r) { rollup(r, 0); });
    ideaRoots.forEach(function(r) { rollup(r, 0); });
    newsRoots.forEach(function(r) { rollup(r, 0); });
    var taskNodes = [], allNodes = [], focusMin = 0, spentMin = 0, doneSpent = 0, maxDepth = 0, doneNodes = 0;
    function walk(list, kind) {
      list.forEach(function(n) {
        n.kind = kind;
        allNodes.push(n);
        if (kind === 'task') {
          taskNodes.push(n);
          if (n.depth > maxDepth) maxDepth = n.depth;
          if (n.done) { doneSpent += n.selfMin; doneNodes++; }
        }
        focusMin += n.selfFocus;
        spentMin += n.selfMin;
        walk(n.children || [], kind);
      });
    }
    walk(roots, 'task');
    walk(ideaRoots, 'idea');
    walk(newsRoots, 'new');
    return {
      roots: roots, ideaRoots: ideaRoots, newsRoots: newsRoots,
      nodes: taskNodes, allNodes: allNodes,
      mainCount: roots.length, totalNodes: taskNodes.length, doneNodes: doneNodes,
      maxDepth: maxDepth, layers: maxDepth + 1,
      totalMin: spentMin,        // 今日投入耗时（任务+想法+随手记 [耗时::]）
      focusMin: focusMin,        // 今日保持专注时长（[计时::]）
      doneMin: doneSpent,
      extraMin: 0
    };
  }

  function detailVisible(n, showDoneOnly) {
    if (!showDoneOnly) return true;
    return n.done || (n.children || []).some(function(c) { return detailVisible(c, true); });
  }

  // 工作时长（秒）：已结算 + 实时增量（上班中每秒涨）
  function workNowSec() {
    var sec = state.work_sec || 0;
    if (state.work_active && state.work_live_start > 0) {
      sec += Math.floor(Date.now() / 1000) - state.work_live_start;
    }
    return Math.max(0, sec);
  }
  // 熬夜时长（秒）：跨午夜后到点下班之间的上班时长
  function overnightNowSec() {
    var sec = state.overnight_sec || 0;
    if (state.work_active && state.work_overnight && state.work_live_start > 0) {
      sec += Math.floor(Date.now() / 1000) - state.work_live_start;
    }
    return Math.max(0, sec);
  }
  // 今日休息时间（秒）：工作时长 − 投入耗时（含实时增量），下限 0。
  // 只在「上班」期间累计——没点上班时工作时长为 0，休息也为 0；
  // 跨午夜工作时长逐天分账、投入耗时逐天拆分，差值自然延续不断。
  function restNowSec(spentSec) {
    return Math.max(0, workNowSec() - (spentSec || 0));
  }
  function renderDetail() {
    var d = computeDetail();
    el('d-date').textContent = state.date;
    var s = '';
    s += '<div class="d-stat"><div class="k">⏱ 今日保持专注时长</div><div class="v hl" id="d-focus">' + fmtMinLong(d.focusMin) + '</div></div>';
    s += '<div class="d-stat"><div class="k">⏳ 今日投入耗时</div><div class="v" id="d-spent">' + fmtMinLong(d.totalMin) + '</div></div>';
    s += '<div class="d-stat"><div class="k">☕ 今日休息时间</div><div class="v" id="d-rest">' + fmtMinLong(restNowSec(d.totalMin)) + '</div></div>';
    var ovn = overnightNowSec();
    s += '<div class="d-stat"><div class="k">⏰ 今日工作时长</div><div class="v hl" id="d-work">' + fmtMinLong(workNowSec()) + '</div><div class="sub" id="d-overnight">' + (ovn > 0 ? '🌙 熬夜 ' + fmtMinLong(ovn) : '') + '</div></div>';
    el('d-stats').innerHTML = s;
    el('d-view-toggle').querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b.dataset.v === detailView); });
    el('d-filter-toggle').querySelectorAll('button').forEach(function(b) { b.classList.toggle('active', b.dataset.f === detailFilter); });
    renderDetailBody(d);
  }
  function renderDetailBody(d) {
    d = d || computeDetail();
    el('mm-wrap').style.display = (detailView === 'map') ? '' : 'none';
    el('dtable-wrap').style.display = (detailView === 'table') ? '' : 'none';

  function renderDetailTable(d) {
    var box = el('dtable-wrap');
    var showDoneOnly = (detailFilter === 'done');
    var rows = [];
    function walkList(list, depth, kind) {
      list.forEach(function(n) {
        if (detailVisible(n, showDoneOnly)) rows.push({ n: n, depth: depth, kind: kind });
        walkList(n.children || [], depth + 1, kind);
      });
    }
    walkList(d.roots || [], 0, 'task');
    walkList(d.ideaRoots || [], 0, 'idea');
    walkList(d.newsRoots || [], 0, 'new');
    if (!rows.length) {
      box.innerHTML = '<div class="empty">' + (showDoneOnly ? '今天还没有已完成的任务节点。' : '今天还没有任务。') + '</div>';
      return;
    }
    var html = '<table class="dtable"><thead><tr><th>条目</th><th>状态</th><th>执行时段</th><th>自身耗时</th><th>分支总耗时</th><th>专注计时</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      var n = r.n;
      var ind = ''; for (var i = 0; i < r.depth; i++) ind += '&nbsp;&nbsp;&nbsp;&nbsp;';
      var prefix = (r.kind === 'idea') ? '💡 ' : (r.kind === 'new') ? '📝 ' : '';
      var status = (r.kind === 'task') ? (n.done ? '✅' : '⬜') : '·';
      var self = n.selfMin > 0 ? fmtMinShort(n.selfMin) : '—';
      var total = (n.children && n.children.length) ? fmtMinShort(n.totalMin) : '';
      var focus = n.selfFocus > 0 ? fmtMinShort(n.selfFocus) : '';
      var span = '';
      if (n.done && n.done_time) span = (n.start_time ? (n.start_time + '→' + n.done_time) : ('→' + n.done_time));
      else if (n.start_time && !n.done) span = n.start_time + ' 开始';
      html += '<tr class="' + (n.done ? 'done' : '') + '"><td class="tx"><span class="ind">' + ind + '</span>' + prefix + esc(n.text) + '</td><td>' + status + '</td><td>' + span + '</td><td>' + self + '</td><td>' + total + '</td><td>' + focus + '</td></tr>';
    });
    html += '</tbody></table>';
    box.innerHTML = html;
  }

  // 渲染展开的复盘气泡 + 牵线（在 renderMindMap 末尾调用）
  function renderMmPop(lnodes, W, totalH) {
    if (!mmOpenReviewKey) return;
    var target = null;
    (function find(list) { list.forEach(function(ln) { if (ln.n.created === mmOpenReviewKey) target = ln; if (!target) find(ln.kids); }); })(lnodes);
    if (!target || !target.n.review_note) return;
    var pop = document.createElement('div');
    pop.className = 'mm-review-pop';
    var txt = document.createElement('div');
    txt.className = 'mm-pop-text';
    txt.textContent = target.n.review_note;
    pop.appendChild(txt);
    var inner = el('mm-inner');
    pop.style.visibility = 'hidden';
    inner.appendChild(pop);
    var pw = pop.offsetWidth || 200, ph = pop.offsetHeight || 40;
    pop.style.visibility = '';
    var NODE_W = 184, GAP = 16;
    // 收集所有节点卡片 rect，用于防遮挡
    var rects = [];
    (function collect(list) { list.forEach(function(ln) { rects.push({ x: ln.x, y: ln.y, w: NODE_W, h: ln.hh }); collect(ln.kids); }); })(lnodes);
    function overlap(ax, ay, aw, ah, bx, by, bw, bh) {
      var ox = Math.max(0, Math.min(ax + aw, bx + bw) - Math.max(ax, bx));
      var oy = Math.max(0, Math.min(ay + ah, by + bh) - Math.max(ay, by));
      return ox * oy;
    }
    function score(px, py) {
      var s = 0;
      rects.forEach(function(r) { s += overlap(px, py, pw, ph, r.x, r.y, r.w, r.h); });
      return s;
    }
    // 4 个候选方向，选重叠面积最小的（都不挡就选 0 重叠的）
    var cands = [
      { px: target.x + NODE_W + GAP, py: target.y + (target.hh - ph) / 2 },   // 右
      { px: target.x - pw - GAP, py: target.y + (target.hh - ph) / 2 },       // 左
      { px: target.x + (NODE_W - pw) / 2, py: target.y - ph - GAP },          // 上
      { px: target.x + (NODE_W - pw) / 2, py: target.y + target.hh + GAP }    // 下
    ];
    var best = null, bestScore = Infinity;
    cands.forEach(function(c) {
      var cx = Math.max(0, Math.min(c.px, Math.max(0, W - pw)));
      var cy = Math.max(0, Math.min(c.py, Math.max(0, totalH - ph)));
      var sc = score(cx, cy);
      if (sc < bestScore) { bestScore = sc; best = { px: cx, py: cy }; }
    });
    pop.style.left = best.px + 'px';
    pop.style.top = best.py + 'px';
    // 连线：根据气泡相对方块的方向，从对应边缘连出
    var svg = el('mm-svg');
    var x1, x2, y1, y2;
    if (best.px >= target.x + NODE_W) {           // 右
      x1 = target.x + NODE_W; x2 = best.px; y1 = target.y + target.hh / 2; y2 = best.py + ph / 2;
    } else if (best.px + pw <= target.x) {        // 左
      x1 = target.x; x2 = best.px + pw; y1 = target.y + target.hh / 2; y2 = best.py + ph / 2;
    } else if (best.py + ph <= target.y) {        // 上
      x1 = target.x + NODE_W / 2; x2 = best.px + pw / 2; y1 = target.y; y2 = best.py + ph;
    } else {                                       // 下
      x1 = target.x + NODE_W / 2; x2 = best.px + pw / 2; y1 = target.y + target.hh; y2 = best.py;
    }
    var mx = (x1 + x2) / 2;
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'mm-pop-line');
    path.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#d9c9a3');
    path.setAttribute('stroke-width', '1.6');
    path.setAttribute('stroke-dasharray', '4 3');
    path.setAttribute('opacity', '0.9');
    svg.appendChild(path);
  }

  function renderMindMap(d) {
    var inner = el('mm-inner');
    var svg = el('mm-svg');
    inner.innerHTML = '';
    svg.innerHTML = '';
    var showDoneOnly = (detailFilter === 'done');
    if (!(d.allNodes && d.allNodes.length)) {
      el('mm-empty').style.display = 'flex';
      el('mm-empty').textContent = '今天还没有任务。回到列表敲一条主线，它会在这里开始裂变。';
      inner.style.transform = '';
      svg.style.transform = '';
      return;
    }
    if (showDoneOnly && d.doneNodes === 0) {
      el('mm-empty').style.display = 'flex';
      el('mm-empty').textContent = '今天还没有已完成的任务节点。';
      inner.style.transform = '';
      svg.style.transform = '';
      return;
    }
    el('mm-empty').style.display = 'none';

    var NODE_W = 184, GAP_X = 52, GAP_Y = 18, DOT = 8, CAT_GAP = 26;
    var lnodes = [];
    function build(list, depth, kind) {
      var out = [];
      list.forEach(function(n) {

        ln.kids = build(n.children || [], depth + 1, kind);

      return out;
    }
    build(d.roots || [], 0, 'task').forEach(function(l) { lnodes.push(l); });
    build(d.ideaRoots || [], 0, 'idea').forEach(function(l) { lnodes.push(l); });
    build(d.newsRoots || [], 0, 'new').forEach(function(l) { lnodes.push(l); });

    function makeEl(ln) {
      if (!ln.vis) {
        var dot = document.createElement('div');

        dot.title = ln.n.text;

      }

      var card = document.createElement('div');

      var meta = document.createElement('div');
      meta.className = 'meta';
      var hasKids = n.children && n.children.length > 0;
      if (hasKids) {
        var bb = document.createElement('span');
        bb.className = 'mm-badge branch';
        bb.textContent = '🌿 ' + (n.totalMin > 0 ? (fmtMinShort(n.totalMin) + (n.selfMin > 0 ? ' (自身 ' + fmtMinShort(n.selfMin) + ')' : '') + ' · ') : '') + n.subDone + '/' + n.subTotal;
        meta.appendChild(bb);
        ln.branchBadge = bb;
      } else {
        var tb = document.createElement('span');

        tb.textContent = '⏳ ' + fmtMinShort(n.selfMin);

        meta.appendChild(tb);
        ln.timeBadge = tb;
      }
      var fb = document.createElement('span');
      fb.className = 'mm-badge time';
      fb.textContent = '⏱ ' + fmtMinShort(n.selfFocus);
      if (!(n.selfFocus > 0)) fb.style.display = 'none';
      meta.appendChild(fb);
      ln.focusBadge = fb;
      if (ln.kind === 'task') {
        var span = '';
        if (n.done && n.done_time) span = (n.start_time ? (n.start_time + '→' + n.done_time) : ('→' + n.done_time));
        else if (n.start_time && !n.done) span = n.start_time + ' 开始';

        n.audio.forEach(function(f) {
          var p = document.createElement('button');
          p.className = 'mm-play';
          p.dataset.file = f;
          p.textContent = '▶️';
          p.title = f;

    }
    (function attach(list) { list.forEach(function(ln) { ln.el = makeEl(ln); inner.appendChild(ln.el); attach(ln.kids); }); })(lnodes);
    (function measure(list) { list.forEach(function(ln) { ln.hh = ln.el.offsetHeight || DOT; measure(ln.kids); }); })(lnodes);

    function subH(ln) {
      if (!ln.kids.length) { ln.h = ln.hh; return ln.hh; }
      var s = 0; ln.kids.forEach(function(k) { s += subH(k); });
      s += GAP_Y * (ln.kids.length - 1);
      ln.h = Math.max(ln.hh, s);
      return ln.h;
    }
    function assign(ln, top) {

      kidsH += ln.kids.length ? GAP_Y * (ln.kids.length - 1) : 0;
      var kidsTop = top + (ln.h - kidsH) / 2;
      ln.y = top + (ln.h - ln.hh) / 2;
      ln.x = ln.depth * (NODE_W + GAP_X);
      var cy = kidsTop;
      ln.kids.forEach(function(k) { assign(k, cy); cy += k.h + GAP_Y; });
    }
    var totalH = 0;
    lnodes.forEach(function(r) { totalH += subH(r); });
    totalH += (lnodes.length ? GAP_Y * (lnodes.length - 1) : 0);
    var prevKind = null;
    lnodes.forEach(function(r) { if (prevKind && r.kind !== prevKind) totalH += CAT_GAP; prevKind = r.kind; });
    var top = 0;
    prevKind = null;
    lnodes.forEach(function(r) { if (prevKind && r.kind !== prevKind) top += CAT_GAP; prevKind = r.kind; assign(r, top); top += r.h + GAP_Y; });

          var x2 = k.x, y2 = k.y + k.hh / 2;
          var mx = (x1 + x2) / 2;

          col = cc[Math.min(k.depth, 4)] || col;

        });
        edges(ln.kids);
      });
    })(lnodes);
    svg.setAttribute('width', W);
    svg.setAttribute('height', Math.max(totalH, 1));
    svg.innerHTML = paths.join('');

    (function place(list) { list.forEach(function(ln) { ln.el.style.left = ln.x + 'px'; ln.el.style.top = ln.y + 'px'; place(ln.kids); }); })(lnodes);
    inner.style.width = W + 'px';
    inner.style.height = totalH + 'px';
    // 展开的复盘气泡 + 牵线
    renderMmPop(lnodes, W, totalH);
    // 固定初始视图：1:1 显示，根节点左上角对齐视口（12px 边距），不随窗口自动缩放；
    // 缩放/平移由双指捏合（wheel+ctrlKey）+ 左键拖拽控制（见事件绑定区）
    mmPan = { tx: 12, ty: 12, s: 1 };
    applyTransform();
    // 保存基准供实时刷新；启动每秒刷新（只更新数字，不重建导图，保住拖拽/缩放/选中/复盘气泡）
    mmLive = { nodes: lnodes, baseFocus: d.focusMin, baseSpent: d.totalMin };

  }

  // ---- 思维导图实时同步：把正在跑的会话（倒计时/秒表/纯做）的已跑秒数叠加显示 ----
  function nodeLiveDelta(n) {
    var now = Math.floor(Date.now() / 1000);
    var ft = state.focus_timing;
    if (ft && ft.kind !== 'habit' && ft.text === n.text && ft.key === n.created) {
      var ran = Math.max(0, Math.min(now - (ft.start_ts || 0), ft.total || 0));
      return { f: ran, s: ran };
    }
    var sws = state.stopwatches || [];
    for (var i = 0; i < sws.length; i++) {
      if (sws[i].text === n.text && sws[i].key === n.created) {
        var r2 = Math.max(0, now - sws[i].startEpoch);
        return { f: r2, s: r2 };
      }
    }
    var s = 0;
    var dlist = state.doing || [];
    for (var j = 0; j < dlist.length; j++) {
      if (dlist[j].text === n.text && dlist[j].key === n.created) {
        s += Math.max(0, now - dlist[j].startEpoch);
      }
    }
    return { f: 0, s: s };
  }
  function liveOf(ln) {
    var d = nodeLiveDelta(ln.n);
    var sub = { f: 0, s: 0 };
    ln.kids.forEach(function(k) { var c = liveOf(k); sub.f += c.f; sub.s += c.s; });
    ln._live = { f: d.f, s: d.s, tf: d.f + sub.f, ts: d.s + sub.s };
    return ln._live;
  }
  function refreshMmLive() {
    if (!mmLive || view !== 'detail') return;
    var totalF = 0, totalS = 0;
    mmLive.nodes.forEach(function(r) { var l = liveOf(r); totalF += l.tf; totalS += l.ts; });
    var ef = el('d-focus'), es = el('d-spent');
    if (ef) ef.textContent = fmtMinLong(mmLive.baseFocus + totalF);
    if (es) es.textContent = fmtMinLong(mmLive.baseSpent + totalS);
    var er = el('d-rest');
    if (er) er.textContent = fmtMinLong(restNowSec(mmLive.baseSpent + totalS));
    var ew = el('d-work'), eo = el('d-overnight');
    if (ew) ew.textContent = fmtMinLong(workNowSec());
    if (eo) { var o = overnightNowSec(); eo.textContent = o > 0 ? '🌙 熬夜 ' + fmtMinLong(o) : ''; }
    (function upd(list) {
      list.forEach(function(ln) {
        if (ln.vis) {
          var n = ln.n;
          var live = ln._live || { f: 0, s: 0, ts: 0 };
          var dispSpent = (n.spent || 0) + live.s;
          var dispFocus = (n.focus || 0) + live.f;
          if (ln.timeBadge) {
            if (dispSpent > 0) { ln.timeBadge.style.display = ''; ln.timeBadge.textContent = '⏳ ' + fmtMinShort(dispSpent); }
            else ln.timeBadge.style.display = 'none';
          }
          if (ln.focusBadge) {
            if (dispFocus > 0) { ln.focusBadge.style.display = ''; ln.focusBadge.textContent = '⏱ ' + fmtMinShort(dispFocus); }
            else ln.focusBadge.style.display = 'none';
          }
          if (ln.branchBadge) {
            var dispTotal = (n.totalMin || 0) + live.ts;
            ln.branchBadge.textContent = '🌿 ' + (dispTotal > 0 ? (fmtMinShort(dispTotal) + (dispSpent > 0 ? ' (自身 ' + fmtMinShort(dispSpent) + ')' : '') + ' · ') : '') + n.subDone + '/' + n.subTotal;
          }
        }
        upd(ln.kids);
      });
    })(mmLive.nodes);
  }
  function startMmTimer() {
    stopMmTimer();
    mmTimer = setInterval(refreshMmLive, 1000);
  }
  function stopMmTimer() {
    if (mmTimer) { clearInterval(mmTimer); mmTimer = null; }
  }

  function startEdit(item, kind, txtEl, key) {
    var old = item.text;
    // 用 textarea 自动撑高：宽度撑满行、字数多时向下长高，一眼看全
    var ta = document.createElement('textarea');
    ta.className = 'inline-input';
    ta.rows = 1;
    ta.spellcheck = false;
    ta.value = old;
    txtEl.replaceWith(ta);
    function fitEdit() { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
    ta.addEventListener('input', fitEdit);
    fitEdit();
    ta.focus();
    ta.setSelectionRange(old.length, old.length);
    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      var nv = ta.value.replace(/\s*\n+\s*/g, ' ').trim();
      if (nv && nv !== old) {
        if (kind === 'habit') {
          post('edit_habit', { index: key, new_text: nv });
        } else {
          post('edit', { target: (kind === 'task' ? 'task' : (curCat === 'idea' ? 'idea' : 'new')), key: key, old_text: old, new_text: nv });
        }
      } else {
        ta.replaceWith(txtEl);
      }
    }
    ta.onblur = commit;
    bindIme(ta);
    ta.onkeydown = function(e) {
      if (e.key === 'Enter') { if (imeBlocking(e)) return; e.preventDefault(); commit(); }
      if (e.key === 'Escape') { e.preventDefault(); ta.value = old; ta.blur(); }
    };
  }

  var modalClock = null;   // 计时器弹窗里的实时走秒
  function fmtClock(sec) {

      box.innerHTML = '<b>' + fmtClock(done) + '</b> 已计时 · 剩 ' + fmtClock(left) + ' · 共 ' + fmtClock(total);
    }
    paint();
    modalClock = setInterval(paint, 200);
  }

        var eb = document.createElement('button');
        eb.className = 'ctx-item';
        eb.textContent = '✏️ 编辑';
        eb.onmousedown = function() {
          hideCtxMenu();
          var txt = item.querySelector('.txt');
          if (txt) startEdit({ text: text }, kind, txt, key);
        };
        ctxMenu.appendChild(eb);
        var db = document.createElement('button');
        db.className = 'ctx-item';
        db.textContent = '🗑 删除';
        db.onmousedown = function() {
          hideCtxMenu();
          post('delete_entry', { target: kind, text: text, key: key });
        };
        ctxMenu.appendChild(db);
      }
    }, 500);
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (lpTimer && e.touches.length === 1) {
      var t = e.touches[0];
      if (Math.abs(t.clientX - lpX) > 10 || Math.abs(t.clientY - lpY) > 10) clearLp();
    }
  }, { passive: true });
  document.addEventListener('touchend', clearLp, { passive: true });
  document.addEventListener('touchcancel', clearLp, { passive: true });
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
